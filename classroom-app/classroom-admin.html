<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Classroom · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="subjects.js"></script>
<style>
  :root{
    --bg: #2d2d2d;
    --card: #3d3d3d;
    --card-2: #464646;
    --badge: #262626;
    --border: #4a4a4a;
    --ink: #f4f2ee;
    --ink-dim: #b7b3ab;
    --ink-faint: #857f75;
    --accent-green: #2f5c34;
    --accent-green-bright: #4c8a52;
    --danger: #c65b5b;
    --radius: 12px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .icon-btn svg { width: 22px; height: 22px; }

  .topbar h1 {
    flex: 1;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .admin-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #eaf5ea;
    background: var(--accent-green);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .admin-level-select {
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 8px;
    padding: 6px 8px;
    max-width: 128px;
    flex-shrink: 0;
  }
  .admin-level-select:focus { outline: none; border-color: var(--accent-green); }

  /* ---- Tabs ---- */
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50;
    display: none; justify-content: flex-end;
  }
  .sidebar-overlay.open { display: flex; }
  .sidebar-panel {
    width: 78%; max-width: 300px; height: 100%; background: var(--bg);
    border-left: 1px solid var(--border); padding: 16px; overflow-y: auto;
  }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px;
  }
  .sidebar-header h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: none; color: var(--ink); padding: 13px 10px; border-radius: 10px;
    font-size: 14.5px; font-weight: 500; cursor: pointer;
  }
  .sidebar-item:active { background: var(--card-2); }
  .sidebar-item svg { width: 19px; height: 19px; color: var(--ink-dim); flex-shrink: 0; }
  .sidebar-item.active { background: rgba(76,138,82,0.16); color: var(--accent-green-bright); }
  .sidebar-item.active svg { color: var(--accent-green-bright); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 10px 4px; }
  .sidebar-section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-faint); padding: 4px 10px 8px;
  }
  .reorder-buttons { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .reorder-buttons button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--ink-dim);
    width: 24px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .reorder-buttons button:disabled { opacity: 0.3; cursor: default; }
  .reorder-buttons svg { width: 12px; height: 12px; }
  .note-select-box { flex-shrink: 0; width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent-green-bright); cursor: pointer; }
  .select-all-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 4px; margin-bottom: 6px; font-size: 13px; color: var(--ink-dim);
  }
  .select-all-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .select-all-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent-green-bright); }
  .delete-selected-btn {
    background: var(--danger-bg, rgba(198,91,91,0.15)); border: 1px solid var(--danger);
    color: var(--danger); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 14.5px;
    font-weight: 600;
    padding: 10px 4px 12px;
    margin-right: 20px;
    cursor: pointer;
    position: relative;
  }

  .tab.active { color: var(--ink); }

  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--accent-green-bright);
    border-radius: 2px;
  }

  /* ---- Subject chip selector ---- */
  .subject-chips {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .subject-chips::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink-dim);
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .chip .chip-icon { font-size: 15px; line-height: 1; }

  .chip.active {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: #eaf5ea;
  }

  /* ---- Content area ---- */
  main {
    flex: 1;
    padding: 6px 16px 32px;
  }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0 12px;
  }

  .list-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-dim);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-green);
    color: #eaf5ea;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .add-btn svg { width: 15px; height: 15px; }

  .add-btn-row { display: flex; gap: 8px; }
  .add-btn-ghost {
    display: flex; align-items: center; gap: 6px; background: var(--card-2); color: var(--ink-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .add-btn-ghost svg { width: 15px; height: 15px; }

  .format-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .format-toolbar button {
    background: var(--card-2); border: 1px solid var(--border); color: var(--ink);
    width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .format-toolbar button:active { background: var(--accent-green); color: #eaf5ea; }

  .bulk-textarea {
    width: 100%; min-height: 260px; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 13px; color: var(--ink); font-size: 13.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.6; resize: vertical;
  }
  .bulk-format-guide {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-dim); line-height: 1.6;
  }
  .bulk-format-guide code {
    background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 4px; color: var(--ink);
  }
  .bulk-preview {
    background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin: 14px 0; font-size: 13px; color: var(--ink-dim);
  }
  .bulk-preview strong { color: var(--ink); }
  .bulk-preview-list { margin-top: 8px; max-height: 200px; overflow-y: auto; }
  .bulk-preview-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .bulk-preview-item:last-child { border-bottom: none; }
  .bulk-error { color: var(--danger); font-size: 12.5px; margin-top: 6px; }

  .item-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .item-body { flex: 1; min-width: 0; }

  .item-body h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 600;
  }

  .item-body p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .item-meta {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-green-bright);
    background: rgba(76, 138, 82, 0.15);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .item-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .item-actions button {
    background: none;
    border: none;
    color: var(--ink-faint);
    padding: 6px;
    cursor: pointer;
    display: flex;
  }
  .item-actions button svg { width: 18px; height: 18px; }
  .item-actions button.delete:hover svg,
  .item-actions button.delete:active svg { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-faint);
  }
  .empty-state .glyph { font-size: 34px; margin-bottom: 10px; }
  .empty-state p { margin: 0; font-size: 14px; }

  /* ---- Form view ---- */
  .form-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 18px;
  }
  .form-header h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 7px;
  }

  .field input[type="text"],
  .field textarea {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 13px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }

  .field textarea { min-height: 96px; line-height: 1.45; }
  .field input[type="text"]:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--accent-green-bright);
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .option-row input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent-green-bright);
    flex-shrink: 0;
  }

  .option-row input[type="text"] {
    flex: 1;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 14.5px;
    font-family: inherit;
  }

  .option-row input[type="text"]:focus {
    outline: none;
    border-color: var(--accent-green-bright);
  }

  .option-hint {
    font-size: 12px;
    color: var(--ink-faint);
    margin: -8px 0 14px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: var(--accent-green); color: #eaf5ea; }
  .btn-ghost { background: var(--card-2); color: var(--ink-dim); }

  .btn-delete-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--danger);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px;
  }

  @media (max-width: 360px) {
    main { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <a class="icon-btn" href="classroom-dashboard.html" aria-label="Back to dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div style="flex:1; min-width:0;">
      <h1 style="margin:0;">Admin Panel</h1>
    </div>
    <select class="admin-level-select" id="classLevelSelect" aria-label="Switch class level" hidden></select>
    <span class="admin-tag">Admin</span>
    <button class="icon-btn" id="sidebarToggle" aria-label="More options">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="icon-btn" aria-label="Log out" onclick="logout('admin-login.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay">
    <div class="sidebar-panel">
      <div class="sidebar-header">
        <h2>Admin Menu</h2>
        <button class="icon-btn" id="sidebarClose" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button class="sidebar-item" data-action="set-tab" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        Notes
      </button>
      <button class="sidebar-item" data-action="set-tab" data-tab="questions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        CBT Questions
      </button>
      <div class="sidebar-divider"></div>
      <button class="sidebar-item" data-action="set-tab" data-tab="codes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        Activation Codes
      </button>
      <button class="sidebar-item" data-action="set-tab" data-tab="announcements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 11-5.8-1.6"/></svg>
        Announcements
      </button>
      <button class="sidebar-item" data-action="set-tab" data-tab="pricing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Pricing
      </button>
      <button class="sidebar-item" data-action="set-tab" data-tab="ai-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01M16 16h.01"/></svg>
        AI Settings
      </button>
      <button class="sidebar-item" data-action="set-tab" data-tab="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        Analytics
      </button>
    </div>
  </div>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="subject-chips" id="subjectChips" role="tablist" aria-label="Select subject"></div>
  <div class="subject-chips" id="testChips" role="tablist" aria-label="Select test batch"></div>

  <main id="content"></main>
</div>

<script>
  // =================================================================
  // DATA
  // The subject list depends on which class level is currently
  // selected (see refreshSubjects() below) — Primary and JSS/SS have
  // different subjects. subjects.js provides the fallback used before
  // the real per-level list has loaded, and if the database call fails.
  // Notes and questions are no longer held in memory — they're read
  // from and written to Supabase (see schema.sql for the tables).
  // =================================================================
  let subjects = SUBJECTS; // from subjects.js — replaced with the real per-level list below

  const TEST_NUMBERS = [1, 2, 3, 4, 5];

  // =================================================================
  // STATE
  // =================================================================
  const state = {
    tab: "notes",         // 'notes' | 'questions'
    subjectId: subjects[0].id,
    classLevel: "primary-5",
    classLevels: [],
    selectedNoteIds: new Set(),
    selectedQuestionIds: new Set(),
    testFilter: "all",      // 'all' | 1 | 2 | 3 | 4 | 5  (questions tab only)
    mode: "list",          // 'list' | 'form' | 'bulk'
    bulkParsed: null,       // parsed items waiting for confirmation during bulk import
    pendingImageUrl: null,   // question image being edited in the current form
    pendingOptionImages: [null, null, null, null],
    pendingDiagrams: [null, null, null, null], // note diagrams: each null or {url, caption}
    passageOptions: [], // comprehension passages available for the current subject+class level (questions tab)
    announcementHistory: [],
    pricingRows: [],
    editingId: null,        // null = new item, otherwise id being edited
    items: [],               // notes or questions for the current subject+tab
    loading: false
  };

  // Refetches the subject list for whichever class level is now
  // selected, and points state.subjectId at the first subject in that
  // list if the current one doesn't exist there (e.g. switching from
  // Primary 5 to JSS 1, which have entirely different subjects).
  async function refreshSubjects() {
    subjects = await getSubjects(state.classLevel);
    if (!subjects.length) subjects = SUBJECTS;
    if (!subjects.find(s => s.id === state.subjectId)) {
      state.subjectId = subjects[0].id;
    }
  }


  function renderTestChips() {
    const el = document.getElementById("testChips");
    if (state.tab !== "questions") { el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "flex";
    const options = [{ v: "all", label: "All tests" }, ...TEST_NUMBERS.map(n => ({ v: n, label: "Test " + n }))];
    el.innerHTML = options.map(o => `
      <button class="chip ${state.testFilter == o.v ? "active" : ""}" data-action="set-test-filter" data-test="${o.v}">
        ${o.label}
      </button>
    `).join("");
  }

  // =================================================================
  // SUPABASE READ/WRITE
  // =================================================================
  async function loadItems() {
    state.loading = true;
    renderTestChips();
    renderContent();

    if (state.tab === "codes") {
      const { data, error } = await supabaseClient
        .from("activation_codes")
        .select("*")
        .order("created_at", { ascending: false });
      state.loading = false;
      if (error) { console.error(error); alert("Couldn't load codes: " + error.message); state.items = []; }
      else state.items = data;
      renderContent();
      return;
    }

    if (state.tab === "announcements") {
      const { data, error } = await supabaseClient
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(20);
      state.loading = false;
      if (error) { console.error(error); state.announcementHistory = []; }
      else state.announcementHistory = data;
      renderContent();
      return;
    }

    if (state.tab === "pricing") {
      const { data, error } = await supabaseClient
        .from("pricing_settings")
        .select("*")
        .order("currency", { ascending: true });
      state.loading = false;
      if (error) { console.error(error); alert("Couldn't load pricing: " + error.message); state.pricingRows = []; }
      else state.pricingRows = data;
      renderContent();
      return;
    }

    if (state.tab === "ai-settings") {
      const { data, error } = await supabaseClient
        .from("app_settings")
        .select("*")
        .eq("key", "gemini_model")
        .single();
      state.loading = false;
      if (error) { console.error(error); state.geminiModel = ""; }
      else state.geminiModel = data?.value || "";
      renderContent();
      return;
    }

    if (state.tab === "analytics") {
      const { data, error } = await supabaseClient.rpc("get_admin_analytics");
      state.loading = false;
      if (error) { console.error(error); state.analytics = null; }
      else state.analytics = data;
      renderContent();
      return;
    }

    if (state.tab === "passages") {
      const { data, error } = await supabaseClient
        .from("comprehension_passages")
        .select("*")
        .eq("subject_id", state.subjectId)
        .eq("class_level", state.classLevel)
        .order("display_order", { ascending: true });
      state.loading = false;
      if (error) { console.error(error); alert("Couldn't load passages: " + error.message); state.items = []; }
      else state.items = data;
      renderContent();
      return;
    }

    const table = state.tab === "notes" ? "notes" : "questions";
    let query = supabaseClient
      .from(table)
      .select("*")
      .eq("subject_id", state.subjectId)
      .eq("class_level", state.classLevel);

    if (state.tab === "questions" && state.testFilter !== "all") {
      query = query.eq("test_number", parseInt(state.testFilter, 10));
    }

    query = state.tab === "notes"
      ? query.order("display_order", { ascending: true })
      : query.order("created_at", { ascending: false });

    const { data, error } = await query;

    if (state.tab === "questions") {
      const { data: passages } = await supabaseClient
        .from("comprehension_passages")
        .select("id, title")
        .eq("subject_id", state.subjectId)
        .eq("class_level", state.classLevel)
        .order("display_order", { ascending: true });
      state.passageOptions = passages || [];
    }

    state.loading = false;
    if (error) {
      console.error(error);
      alert("Couldn't load data: " + error.message);
      state.items = [];
    } else {
      state.items = data;
    }
    renderTestChips();
    renderContent();
  }

  async function saveNote(subjectId, note) {
    const payload = { subject_id: subjectId, class_level: state.classLevel, title: note.title, body: note.body, video_url: note.video_url || null, diagram_images: note.diagram_images || null };
    if (note.id) {
      const { error } = await supabaseClient.from("notes").update({ ...payload, updated_at: new Date().toISOString() }).eq("id", note.id);
      if (error) { alert("Couldn't save note: " + error.message); return false; }
      return true;
    }
    const maxOrder = state.items.reduce((max, n) => Math.max(max, n.display_order || 0), 0);
    const { error } = await supabaseClient.from("notes").insert({ ...payload, display_order: maxOrder + 1 });
    if (error) { alert("Couldn't save note: " + error.message); return false; }
    return true;
  }

  async function moveNote(id, direction) {
    const sorted = [...state.items].sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
    const idx = sorted.findIndex(n => n.id === id);
    const swapIdx = direction === "up" ? idx - 1 : idx + 1;
    if (idx === -1 || swapIdx < 0 || swapIdx >= sorted.length) return false;

    const a = sorted[idx], b = sorted[swapIdx];
    const [orderA, orderB] = [a.display_order || 0, b.display_order || 0];
    const results = await Promise.all([
      supabaseClient.from("notes").update({ display_order: orderB }).eq("id", a.id),
      supabaseClient.from("notes").update({ display_order: orderA }).eq("id", b.id)
    ]);
    if (results.some(r => r.error)) { alert("Couldn't reorder notes."); return false; }
    return true;
  }

  function generateCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1 to avoid confusion
    let code = "";
    for (let i = 0; i < 10; i++) {
      if (i === 5) code += "-";
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
  }

  // Turns a friendly, easy-to-type shorthand ("gemini 2.5 lite", "3.5 flash
  // lite", "2.5 flash") into the exact model ID the Gemini API expects.
  // Known shorthand goes through this lookup table; anything not
  // recognized is just cleaned up (spaces -> hyphens, "gemini-" prefix
  // added if missing) and used as typed, so pasting the exact ID always
  // still works too. Update ALIASES here whenever Google ships a new
  // model — nothing else needs to change.
  function normalizeGeminiModel(raw) {
    const input = (raw || "").trim().toLowerCase();
    if (!input) return "";
    const key = input.replace(/^gemini[\s-]*/, "").replace(/[\s_-]+/g, " ").trim();

    const ALIASES = {
      "2.5 lite": "gemini-2.5-flash-lite",
      "2.5 flash lite": "gemini-2.5-flash-lite",
      "2.5 flash": "gemini-2.5-flash",
      "2.5 pro": "gemini-2.5-pro",
      "3.1 lite": "gemini-3.1-flash-lite",
      "3.1 flash lite": "gemini-3.1-flash-lite",
      "3.5 lite": "gemini-3.5-flash-lite",
      "3.5 flash lite": "gemini-3.5-flash-lite",
      "3.5 flash": "gemini-3.5-flash",
      "3.6 flash": "gemini-3.6-flash",
      "3.7 flash": "gemini-3.7-flash",
      "3.1 pro": "gemini-3.1-pro",
      "3 pro": "gemini-3.1-pro",
      "flash latest": "gemini-flash-latest",
      "flash lite latest": "gemini-flash-lite-latest",
      "pro latest": "gemini-pro-latest",
    };
    if (ALIASES[key]) return ALIASES[key];

    // Not a recognized shorthand — assume they already typed (or
    // pasted) the real model ID, just tidy it up.
    const cleaned = input.replace(/\s+/g, "-").replace(/-+/g, "-");
    return cleaned.startsWith("gemini-") ? cleaned : "gemini-" + cleaned;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  // ---- Formatting toolbar (Bold / Italic / Bullet) for textareas ----
  function attachFormatToolbar() {
    document.querySelectorAll(".format-toolbar button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const textarea = btn.closest(".field").querySelector("textarea");
        if (!textarea) return;
        if (btn.dataset.insert) {
          insertAtCursor(textarea, btn.dataset.insert);
        } else if (btn.dataset.wrap) {
          const [before, after] = btn.dataset.wrap.split("|");
          wrapSelection(textarea, before, after);
        } else if (btn.hasAttribute("data-bullet")) {
          insertBullet(textarea);
        }
      });
    });
  }

  function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart, end = textarea.selectionEnd;
    const value = textarea.value;
    textarea.value = value.slice(0, start) + text + value.slice(end);
    textarea.focus();
    const pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
  }

  function wrapSelection(textarea, before, after) {
    const start = textarea.selectionStart, end = textarea.selectionEnd;
    const text = textarea.value;
    const selected = text.slice(start, end) || "text";
    textarea.value = text.slice(0, start) + before + selected + after + text.slice(end);
    textarea.focus();
    textarea.selectionStart = start + before.length;
    textarea.selectionEnd = start + before.length + selected.length;
  }

  function insertBullet(textarea) {

    textarea.value = text.slice(0, lineStart) + "- " + text.slice(lineStart);

    if (error) { alert("Image upload failed: " + error.message); return null; }
    const { data } = supabaseClient.storage.from("question-images").getPublicUrl(path);
    return data.publicUrl;
  }

  // =================================================================
  // BULK IMPORT — Notes
  // Format:
  //   ### Note Title
  //   Note body text, can span multiple lines.
  //
  //   ### Next Note Title
  //   Its body text...
  // =================================================================
  function parseNotesBulk(text) {
    const blocks = text.split(/\n(?=###\s)/).map(b => b.trim()).filter(Boolean);
    const items = [];
    const errors = [];
    blocks.forEach((block, i) => {
      const match = block.match(/^###\s*(.+?)\n([\s\S]*)$/);
      if (!match) { errors.push(`Block ${i + 1}: couldn't find a "### Title" line.`); return; }
      const title = match[1].trim();
      const body = match[2].trim();
      if (!title || !body) { errors.push(`Block ${i + 1}: missing a title or body.`); return; }
      items.push({ title, body });
    });
    return { items, errors };
  }

  function renderNoteBulkForm() {
    return `
      <div class="form-header"><h2>Bulk Import Notes · ${currentSubject().name}</h2></div>
      <div class="bulk-format-guide">
        Paste multiple notes at once. Start each note with <code>### Title</code> on its own line, followed by the note's body text. Leave a blank line between notes.
      </div>
      <textarea class="bulk-textarea" id="bulkText" placeholder="### The Three Arms of Government
The Executive, Legislature, and Judiciary — what each one does...

### Another Note Title
Body text here..."></textarea>
      <div id="bulkPreviewArea"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-action="cancel-form">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="preview-bulk-notes">Preview</button>
      </div>
    `;
  }

  // =================================================================
  // BULK IMPORT — Questions
  // Format:
  //   Q: Question text here?
  //   A) Option one
  //   *B) Option two   <- asterisk marks the correct answer
  //   C) Option three
  //   D) Option four
  //   Explanation: Why B is correct.
  //
  //   Q: Next question...
  //   ...
  // =================================================================
  function parseQuestionsBulk(text) {
    const blocks = text.split(/\n(?=Q:\s)/).map(b => b.trim()).filter(Boolean);
    const items = [];
    const errors = [];

    blocks.forEach((block, i) => {
      const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
      if (!lines.length || !lines[0].startsWith("Q:")) {
        errors.push(`Block ${i + 1}: doesn't start with "Q:".`);
        return;
      }
      const question = lines[0].replace(/^Q:\s*/, "").trim();
      const options = [];
      let correctIndex = -1;
      let explanation = "";

      lines.slice(1).forEach((line) => {
        const optMatch = line.match(/^(\*?)([A-F])\)\s*(.+)$/);
        if (optMatch) {
          if (optMatch[1] === "*") correctIndex = options.length;
          options.push(optMatch[3].trim());
          return;
        }
        const explMatch = line.match(/^Explanation:\s*(.+)$/i);
        if (explMatch) explanation = explMatch[1].trim();
      });

      if (!question) { errors.push(`Block ${i + 1}: missing question text.`); return; }
      if (options.length < 2) { errors.push(`Block ${i + 1} ("${question.slice(0, 40)}..."): needs at least 2 options.`); return; }
      if (correctIndex === -1) { errors.push(`Block ${i + 1} ("${question.slice(0, 40)}..."): no option marked correct (use *A) instead of A)).`); return; }

      items.push({ question, options, correctIndex, explanation });
    });

    return { items, errors };
  }

  function renderBulkPreview(result, kind) {
    const area = document.getElementById("bulkPreviewArea");
    if (!result.items.length && !result.errors.length) { area.innerHTML = ""; return; }

    const itemsHtml = result.items.map(item =>
      kind === "notes"
        ? `<div class="bulk-preview-item">📝 ${escapeHtml(item.title)}</div>`
        : `<div class="bulk-preview-item">❓ ${escapeHtml(item.question.slice(0, 70))}${item.question.length > 70 ? "…" : ""}</div>`
    ).join("");

    const errorsHtml = result.errors.map(e => `<div class="bulk-error">⚠️ ${escapeHtml(e)}</div>`).join("");

    area.innerHTML = `
      <div class="bulk-preview">
        <strong>${result.items.length} ${kind === "notes" ? "note" : "question"}${result.items.length === 1 ? "" : "s"} ready to import</strong>
        ${result.errors.length ? `<div style="margin-top:8px;">${result.errors.length} block${result.errors.length === 1 ? "" : "s"} skipped:</div>${errorsHtml}` : ""}
        ${result.items.length ? `<div class="bulk-preview-list">${itemsHtml}</div>` : ""}
      </div>
      ${result.items.length ? `<div class="form-actions"><button type="button" class="btn btn-primary" data-action="confirm-bulk-${kind}">Import ${result.items.length} ${kind === "notes" ? "Note" : "Question"}${result.items.length === 1 ? "" : "s"}</button></div>` : ""}
    `;
  }

  async function bulkInsertNotes(items) {
    const maxOrder = state.items.reduce((max, n) => Math.max(max, n.display_order || 0), 0);
    const payload = items.map((n, i) => ({
      subject_id: state.subjectId,
      class_level: state.classLevel,
      title: n.title,
      body: n.body,
      display_order: maxOrder + i + 1
    }));
    const { error } = await supabaseClient.from("notes").insert(payload);
    if (error) { alert("Bulk import failed: " + error.message); return false; }
    return true;
  }

  async function bulkInsertQuestions(items, testNumber) {
    const payload = items.map(q => ({
      subject_id: state.subjectId,
      class_level: state.classLevel,
      question: q.question,
      options: q.options,
      correct_index: q.correctIndex,
      explanation: q.explanation || null,
      test_number: testNumber
    }));
    const { error } = await supabaseClient.from("questions").insert(payload);
    if (error) { alert("Bulk import failed: " + error.message); return false; }
    return true;
  }

  function renderAll() {
    renderTabs();
    renderChips();
    renderContent();
  }

  // =================================================================
  // EVENTS (delegated — content is re-rendered often)
  // =================================================================
  document.addEventListener("input", (e) => {
    if (e.target.id === "geminiModelInput") {
      const preview = document.getElementById("geminiModelPreview");
      const value = e.target.value.trim();
      preview.textContent = "Will save as: " + (value ? normalizeGeminiModel(value) : "—");
    }
  });

  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === "set-tab") {
      state.tab = btn.dataset.tab;
      state.mode = "list";
      state.editingId = null;
      state.selectedNoteIds.clear();
      state.selectedQuestionIds.clear();
      renderTabs(); renderChips();
      await loadItems();
    } else if (action === "set-subject") {
      state.subjectId = btn.dataset.subject;
      state.mode = "list";
      state.editingId = null;
      state.selectedNoteIds.clear();
      state.selectedQuestionIds.clear();
      renderTabs(); renderChips();
      await loadItems();
    } else if (action === "move-note-up" || action === "move-note-down") {
      const ok = await moveNote(btn.dataset.id, action === "move-note-up" ? "up" : "down");
      if (ok) await loadItems();
    } else if (action === "toggle-select-note") {
      const id = btn.dataset.id;
      if (state.selectedNoteIds.has(id)) state.selectedNoteIds.delete(id);
      else state.selectedNoteIds.add(id);
      renderContent();
    } else if (action === "toggle-select-all-notes") {
      if (state.selectedNoteIds.size === state.items.length) {
        state.selectedNoteIds.clear();
      } else {
        state.selectedNoteIds = new Set(state.items.map(n => n.id));
      }
      renderContent();
    } else if (action === "delete-selected-notes") {
      const count = state.selectedNoteIds.size;
      if (confirm(`Delete ${count} selected note${count === 1 ? "" : "s"}? This can't be undone.`)) {
        const ok = await bulkDeleteNotes(Array.from(state.selectedNoteIds));
        state.selectedNoteIds.clear();
        if (ok) await loadItems();
      }
    } else if (action === "toggle-select-question") {
      const id = btn.dataset.id;
      if (state.selectedQuestionIds.has(id)) state.selectedQuestionIds.delete(id);
      else state.selectedQuestionIds.add(id);
      renderContent();
    } else if (action === "toggle-select-all-questions") {
      if (state.selectedQuestionIds.size === state.items.length) {
        state.selectedQuestionIds.clear();
      } else {
        state.selectedQuestionIds = new Set(state.items.map(q => q.id));
      }
      renderContent();
    } else if (action === "delete-selected-questions") {
      const count = state.selectedQuestionIds.size;
      if (confirm(`Delete ${count} selected question${count === 1 ? "" : "s"}? This can't be undone.`)) {
        const ok = await bulkDeleteQuestions(Array.from(state.selectedQuestionIds));
        state.selectedQuestionIds.clear();
        if (ok) await loadItems();
      }
    } else if (action === "test-ai-model") {
      const raw = document.getElementById("geminiModelInput").value.trim();
      const resultEl = document.getElementById("testAiModelResult");
      if (!raw) { resultEl.innerHTML = `<div class="option-hint" style="color:var(--danger);">Type a model first.</div>`; return; }
      const modelToTest = normalizeGeminiModel(raw);

      btn.disabled = true; btn.textContent = "Testing…";
      resultEl.innerHTML = `<div class="option-hint">Asking ${escapeHtml(modelToTest)} a test question…</div>`;

      const { data, error } = await supabaseClient.functions.invoke("ask-ai", {
        body: { question: "In one short sentence, say hello and confirm which model you are.", previewModel: modelToTest }
      });

      btn.disabled = false; btn.textContent = "Test";

      if (error || data?.error) {
        resultEl.innerHTML = `<div style="background:rgba(224,128,128,0.12); border:1px solid var(--danger); border-radius:10px; padding:12px; font-size:13px; color:var(--danger);">${escapeHtml(data?.error || error.message)}</div>`;
      } else {
        resultEl.innerHTML = `<div style="background:var(--card-2); border:1px solid var(--accent-green-bright); border-radius:10px; padding:12px; font-size:13.5px;">${escapeHtml(data.answer)}</div>`;
      }
    } else if (action === "set-test-filter") {
      state.testFilter = btn.dataset.test;
      state.mode = "list";
      state.editingId = null;
      state.selectedQuestionIds.clear();
      await loadItems();
    } else if (action === "new-note" || action === "new-question" || action === "new-passage") {
      state.mode = "form"; state.editingId = null;
      state.pendingImageUrl = null; state.pendingOptionImages = [null, null, null, null];
      state.pendingDiagrams = [null, null, null, null];
      renderContent();
    } else if (action === "bulk-notes" || action === "bulk-questions") {
      state.mode = "bulk"; state.bulkParsed = null; renderContent();
    } else if (action === "preview-bulk-notes") {
      const text = document.getElementById("bulkText").value;
      const result = parseNotesBulk(text);
      state.bulkParsed = result;
      renderBulkPreview(result, "notes");
    } else if (action === "preview-bulk-questions") {
      const text = document.getElementById("bulkText").value;
      const result = parseQuestionsBulk(text);
      state.bulkParsed = result;
      renderBulkPreview(result, "questions");
    } else if (action === "confirm-bulk-notes") {
      if (!state.bulkParsed || !state.bulkParsed.items.length) return;
      btn.disabled = true; btn.textContent = "Importing…";
      const ok = await bulkInsertNotes(state.bulkParsed.items);
      state.mode = "list"; state.bulkParsed = null;
      if (ok) await loadItems(); else renderContent();
    } else if (action === "confirm-bulk-questions") {
      if (!state.bulkParsed || !state.bulkParsed.items.length) return;
      btn.disabled = true; btn.textContent = "Importing…";
      const testNumber = parseInt(document.getElementById("bulkTest").value, 10);
      const ok = await bulkInsertQuestions(state.bulkParsed.items, testNumber);
      state.mode = "list"; state.bulkParsed = null;
      if (ok) await loadItems(); else renderContent();
    } else if (action === "toggle-lock") {
      const ok = await toggleNoteLock(btn.dataset.id, btn.dataset.locked === "1");
      if (ok) await loadItems();
    } else if (action === "new-code") {
      btn.disabled = true; btn.textContent = "Generating…";
      const ok = await createActivationCode("");
      if (ok) await loadItems();
    } else if (action === "delete-code") {
      if (confirm("Delete this activation code? This can't be undone.")) {
        const ok = await deleteActivationCode(btn.dataset.code);
        if (ok) await loadItems();
      }
    } else if (action === "edit-note" || action === "edit-question") {
      state.mode = "form"; state.editingId = btn.dataset.id;
      if (action === "edit-question") {
        const q = state.items.find(item => item.id === btn.dataset.id);
        state.pendingImageUrl = q?.image_url || null;
        const opts = q?.options || ["", "", "", ""];
        state.pendingOptionImages = opts.map((_, i) => (q?.option_images && q.option_images[i]) || null);
      } else {
        const n = state.items.find(item => item.id === btn.dataset.id);
        const existingDiagrams = Array.isArray(n?.diagram_images) ? n.diagram_images : [];
        state.pendingDiagrams = [0, 1, 2, 3].map(i => existingDiagrams[i] || null);
      }
      renderContent();
    } else if (action === "edit-passage") {
      state.mode = "form"; state.editingId = btn.dataset.id;
      renderContent();
    } else if (action === "delete-note") {
      if (confirm("Delete this note? This can't be undone.")) {
        const ok = await deleteNote(btn.dataset.id);
        state.mode = "list"; state.editingId = null;
        if (ok) await loadItems(); else renderContent();
      }
    } else if (action === "delete-question") {
      if (confirm("Delete this question? This can't be undone.")) {
        const ok = await deleteQuestion(btn.dataset.id);
        state.mode = "list"; state.editingId = null;
        if (ok) await loadItems(); else renderContent();
      }
    } else if (action === "delete-passage") {
      if (confirm("Delete this passage? Questions linked to it will keep working but lose their passage. This can't be undone.")) {
        const ok = await deletePassage(btn.dataset.id);
        state.mode = "list"; state.editingId = null;
        if (ok) await loadItems(); else renderContent();
      }
    } else if (action === "cancel-form") {
      state.mode = "list"; state.editingId = null;
      state.pendingImageUrl = null; state.pendingOptionImages = [null, null, null, null];
      state.pendingDiagrams = [null, null, null, null];
      renderContent();
    }
  });

  document.addEventListener("submit", async (e) => {
    if (e.target.id === "pricingForm") {
      e.preventDefault();
      const inputs = Array.from(document.querySelectorAll("#pricingForm input[data-currency]"));
      const updates = inputs.map(i => ({ currency: i.dataset.currency, amount: parseFloat(i.value) }));
      if (updates.some(u => isNaN(u.amount) || u.amount < 0)) { alert("Please enter valid prices."); return; }

      const btn = document.getElementById("savePricingBtn");
      btn.disabled = true; btn.textContent = "Saving…";
      const ok = await savePricing(updates);
      btn.disabled = false; btn.textContent = "Save Pricing";
      if (ok) { alert("Pricing updated."); await loadItems(); }
      return;
    }

    if (e.target.id === "aiSettingsForm") {
      e.preventDefault();
      const raw = document.getElementById("geminiModelInput").value.trim();
      if (!raw) { alert("Please enter a model."); return; }
      const value = normalizeGeminiModel(raw);

      const btn = document.getElementById("saveAiSettingsBtn");
      btn.disabled = true; btn.textContent = "Saving…";
      const ok = await saveGeminiModel(value);
      btn.disabled = false; btn.textContent = "Save Model";
      if (ok) { alert(`Chatbot model updated to ${value}.`); await loadItems(); }
      return;
    }

    if (e.target.id === "announcementForm") {
      e.preventDefault();
      const subject = document.getElementById("annSubject").value.trim();
      const message = document.getElementById("annMessage").value.trim();
      if (!subject || !message) return;

      if (!confirm(`Send this to every registered user? This can't be undone.\n\nSubject: ${subject}`)) return;

      const btn = document.getElementById("sendAnnouncementBtn");
      btn.disabled = true; btn.textContent = "Sending…";
      const result = await sendAnnouncement(subject, message);
      btn.disabled = false; btn.textContent = "Send to All Users";

      if (result) {
        alert(`Sent to ${result.sent} of ${result.total} users.${result.failed ? ` ${result.failed} failed.` : ""}`);
        await loadItems();
      }
    }

    if (e.target.id === "noteForm") {
      e.preventDefault();
      const title = document.getElementById("noteTitle").value.trim();
      const body = document.getElementById("noteBody").value.trim();
      const videoUrl = document.getElementById("noteVideoUrl").value.trim();
      if (!title || !body) return;

      const diagramImages = state.pendingDiagrams.filter(d => d && d.url);

      const ok = await saveNote(state.subjectId, { id: state.editingId, title, body, video_url: videoUrl, diagram_images: diagramImages.length ? diagramImages : null });
      state.mode = "list"; state.editingId = null;
      state.pendingDiagrams = [null, null, null, null];
      if (ok) await loadItems(); else renderContent();
    }

    if (e.target.id === "passageForm") {
      e.preventDefault();
      const title = document.getElementById("passageTitle").value.trim();
      const body = document.getElementById("passageBody").value.trim();
      if (!title || !body) return;

      const ok = await savePassage(state.subjectId, { id: state.editingId, title, body });
      state.mode = "list"; state.editingId = null;
      if (ok) await loadItems(); else renderContent();
    }

    if (e.target.id === "questionForm") {
      e.preventDefault();
      const question = document.getElementById("qText").value.trim();
      const options = [0, 1, 2, 3].map(i => document.getElementById("opt" + i).value.trim());
      const explanation = document.getElementById("qExplain").value.trim();
      const testNumber = parseInt(document.getElementById("qTest").value, 10);
      const passageId = document.getElementById("qPassage").value || null;
      const correctRadio = e.target.querySelector('input[name="correctOption"]:checked');
      if (!question || options.some(o => !o) || !correctRadio) return;

      const ok = await saveQuestion(state.subjectId, {
        id: state.editingId,
        question,
        options,
        correctIndex: parseInt(correctRadio.value, 10),
        explanation,
        testNumber,
        passageId,
        imageUrl: state.pendingImageUrl,
        optionImages: state.pendingOptionImages.some(u => u) ? state.pendingOptionImages : null
      });
      state.mode = "list"; state.editingId = null;
      state.pendingImageUrl = null; state.pendingOptionImages = [null, null, null, null];
      if (ok) await loadItems(); else renderContent();
    }
  });

  const sidebarOverlay = document.getElementById("sidebarOverlay");
  document.getElementById("sidebarToggle").addEventListener("click", () => sidebarOverlay.classList.add("open"));
  document.getElementById("sidebarClose").addEventListener("click", () => sidebarOverlay.classList.remove("open"));
  sidebarOverlay.addEventListener("click", (e) => { if (e.target === sidebarOverlay) sidebarOverlay.classList.remove("open"); });

  document.getElementById("classLevelSelect").addEventListener("change", (e) => {
    switchClassLevel(e.target.value);
  });
  document.querySelectorAll(".sidebar-item[data-tab]").forEach(item => {
    item.addEventListener("click", () => sidebarOverlay.classList.remove("open"));
  });

  (async () => {
    const admin = await requireAdmin(); // redirects to admin-login.html if not the admin
    if (!admin) return;
    state.classLevels = await getClassLevels();
    if (!state.classLevels.length) state.classLevels = [{ id: "primary-5", name: "Common Entrance (Primary 5)" }];
    // Default to Common Entrance (Primary 5) if it's in the list — it's
    // the level with actual content — otherwise fall back to whichever
    // level sorts first.
    state.classLevel = state.classLevels.find(cl => cl.id === "primary-5")
      ? "primary-5"
      : state.classLevels[0].id;
    await refreshSubjects();
    renderClassLevels();
    renderTabs();
    renderChips();
    await loadItems();
  })();
</script>

</body>
</html>
